<style>
    .hub-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 99999; justify-content: center; align-items: center; padding: 16px; opacity: 0; transition: opacity 0.3s ease; }
    .hub-modal-overlay.show { display: flex; opacity: 1; }
    .hub-modal-container { background: #FFFFFF; width: 100%; max-width: 850px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; transform: translateY(20px); transition: transform 0.3s ease; }
    .hub-modal-overlay.show .hub-modal-container { transform: translateY(0); }
    
    .hub-header { padding: 20px 24px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; position: sticky; top: 0; z-index: 20; }
    .hub-close-btn { background: #E2E8F0; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #475569; transition: 0.2s; font-size: 16px; font-weight: bold;}
    .hub-close-btn:hover { background: #EF4444; color: #FFF; }
    
    .hub-admin-panel { padding: 20px 24px; background: #EEF2FF; border-bottom: 1px dashed #A5B4FC; }
    .hub-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .hub-input, .hub-select { width: 100%; padding: 12px 14px; border: 1px solid #CBD5E1; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; box-sizing: border-box; }
    .hub-input:focus, .hub-select:focus { border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    .hub-content { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #F9FAFB; }
    .hub-category-card { background: #FFF; border-radius: 16px; border: 1px solid #E2E8F0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .hub-category-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; transition: 0.2s; background: #FFF; }
    .hub-category-header:hover { background: #F8FAFC; }
    .hub-category-title { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900; color: #1E293B; margin: 0; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .hub-category-body { display: block; padding: 0 20px 20px 20px; border-top: 1px dashed transparent; }
    
    .hub-project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .hub-project-card { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E5E7EB; border-radius: 12px; background: #FFF; text-decoration: none; transition: 0.2s; cursor: pointer; }
    .hub-project-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #93C5FD; }
    .hub-project-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; background: #F8FAFC; border: 1px solid #F1F5F9; }
    .hub-project-name { font-size: 13.5px; font-weight: 800; color: #334155; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .hub-chevron { transition: transform 0.3s; color: #94A3B8; font-weight: bold; }
    @media (max-width: 768px) {
        .hub-category-card.is-collapsed .hub-category-body { display: none; }
        .hub-category-card:not(.is-collapsed) .hub-category-header { border-bottom: 1px dashed #E2E8F0; }
        .hub-category-card.is-collapsed .hub-chevron { transform: rotate(-90deg); }
    }
</style>

<div id="mediaHubModal" class="hub-modal-overlay" onclick="closeMediaHubModal(event)">
    <div class="hub-modal-container" onclick="event.stopPropagation()">
        
        <div class="hub-header">
            <h2 class="premium-title-gradient" style="font-size: 20px !important; margin: 0;">🗂️ KHO TƯ LIỆU CONTENT</h2>
            <button class="hub-close-btn" onclick="closeMediaHubModal()">✕</button>
        </div>

        <!-- ADMIN PANEL WRAPPER -->
        <div id="hubAdminWrapper" class="hub-admin-panel" style="padding: 16px 24px; display: none; background: #EEF2FF; border-bottom: 1px dashed #A5B4FC;">
            <div onclick="toggleMediaAdminCard('hubAdminPanelBody')" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;">
                <div style="font-size: 13px; font-weight: 900; color: #4338CA; text-transform: uppercase;">⚡ Bảng Điều Khiển Admin (Thêm Tư Liệu)</div>
                <span id="chev_hubAdminPanelBody" style="font-size: 12px; color: #4338CA; transition: transform 0.3s; transform: rotate(0deg);">▼</span>
            </div>
            
            <div id="hubAdminPanelBody" style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
                <div class="hub-admin-grid">
                    <select id="hubCatInput" class="hub-select">
                        <option value="Yêu cầu thực hiện task">📋 Yêu cầu thực hiện task</option>
                        <option value="Hình ảnh và Video">📸 Hình ảnh & Video</option>
                        <option value="Nhạc">🎵 Nhạc (Audio)</option>
                        <option value="Khác">🗂️ Khác</option>
                    </select>
                    <select id="hubProjInput" class="hub-select"><option value="">⏳ Đang tải dự án...</option></select>
                    <input type="text" id="hubLinkInput" class="hub-input" placeholder="Dán Link Google Drive của Tư liệu...">
                </div>
                                
                <div style="display: flex; gap: 12px; align-items: center; width: 100%;">
                    <input type="text" id="logoDriveLinkInput" class="hub-input" placeholder="Dán link Google Drive của ảnh Logo dự án..." style="flex: 1;" oninput="previewLogoFromLink(this.value)">
                    <div style="width: 42px; height: 42px; border-radius: 8px; border: 1px dashed #CBD5E1; display: flex; align-items: center; justify-content: center; background: #F8FAFC; flex-shrink: 0; overflow: hidden;">
                        <img id="hubLogoPreview" src="" style="width: 100%; height: 100%; object-fit: contain; display: none;">
                    </div>
                    <button id="btnSubmitHub" onclick="submitHubItem()" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #FFF; border: none; height: 42px; padding: 0 24px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; white-space: nowrap;">+ THÊM</button>
                </div>
            </div>
        </div>

        <!-- USER CONTENT -->
        <div class="hub-content">
            <div id="hubLoading" style="text-align: center; padding: 40px; color: #64748B; font-size: 14px; font-weight: 600;">⏳ Đang kéo dữ liệu từ kho...</div>
            <div id="hubDataContainer" style="display: none; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>
</div>

<script>
// 🌐 THUẬT TOÁN ĐỊNH DẠNG LINK DRIVE XEM ẢNH TRỰC TIẾP (BẢN BỌC THÉP)
function ensureDirectDriveImgUrl(url) {
    if (!url || url.trim() === "" || url === "-") {
        return "https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Drive_logo_%282020%29.svg";
    }
    
    // Nếu là link Drive, tiến hành bóc tách ID bằng Regex độc lập
    if (url.includes("drive.google.com")) {
        let fileId = "";
        const matchD = url.match(/\/d\/([a-zA-Z0-9-_]+)/i);
        const matchId = url.match(/id=([a-zA-Z0-9-_]+)/i);
        
        if (matchD) fileId = matchD[1];
        else if (matchId) fileId = matchId[1];
        
        // Ép sang endpoint lh3 bất tử bỏ qua rào cản CORS của trình duyệt
        if (fileId) return "https://lh3.googleusercontent.com/d/" + fileId;
    }
    return url;
}

function openMediaHubModal() {
    let modal = document.getElementById('mediaHubModal');
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
    
    let sessionUser = (typeof appUser !== 'undefined' && appUser) ? appUser : JSON.parse(localStorage.getItem('appUserSession'));
    if (sessionUser && (sessionUser.role === 'Admin' || sessionUser.role === 'Quản lý')) {
        document.getElementById('hubAdminWrapper').style.display = 'block'; 
    }
    fetchMediaHubData();
}

function closeMediaHubModal(e) {
    if (e && e.target !== document.getElementById('mediaHubModal')) return;
    let modal = document.getElementById('mediaHubModal');
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

function toggleHubCard(headerEl) {
    if(window.innerWidth > 768) return; 
    headerEl.parentElement.classList.toggle('is-collapsed');
}

function toggleMediaAdminCard(id) {
    const body = document.getElementById(id);
    const chev = document.getElementById('chev_' + id);
    if (!body || !chev) return;
    const isHidden = body.style.display === 'none';
    body.style.display = isHidden ? 'flex' : 'none';
    chev.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
}

// Hàm xử lý hiển thị ảnh trực thời khi Admin vừa điền/dán link vào ô nhập
function previewLogoFromLink(url) {
    const previewImg = document.getElementById('hubLogoPreview');
    if (url && url.trim() !== "") {
        previewImg.src = ensureDirectDriveImgUrl(url); 
        previewImg.style.display = "block";
    } else {
        previewImg.style.display = "none";
    }
}

function fetchMediaHubData() {
    document.getElementById('hubLoading').style.display = 'block';
    document.getElementById('hubDataContainer').style.display = 'none';

    google.script.run.withSuccessHandler(res => {
        document.getElementById('hubLoading').style.display = 'none';
        if(!res.success) return alert("Lỗi tải Hub: " + res.message);
        
        let opts = `<option value="">-- Chọn Dự án --</option>`;
        res.projects.forEach(p => opts += `<option value="${p}">${p}</option>`);
        document.getElementById('hubProjInput').innerHTML = opts;

        renderHubCards(res.mediaItems);
    }).getMediaHubData();
}

function renderHubCards(items) {
    let container = document.getElementById('hubDataContainer');
    let cats = [
        { id: "Yêu cầu thực hiện task", icon: "📋", title: "YÊU CẦU THỰC HIỆN TASK" },
        { id: "Hình ảnh và Video", icon: "📸", title: "HÌNH ẢNH & VIDEO" },
        { id: "Nhạc", icon: "🎵", title: "ÂM NHẠC & ÂM THANH" },
        { id: "Khác", icon: "🗂️", title: "TÀI LIỆU KHÁC" }
    ];

    let html = "";
    cats.forEach(c => {
        let catItems = items.filter(x => x.category === c.id);
        if (catItems.length === 0) return;

        let cardsHtml = "";
        catItems.forEach(item => {
            // 🚀 SỬA TẠI ĐÂY: Ép link thô từ backend qua hàm lọc để tự động cứu sống các logo lỗi cũ!
            let logoSrc = ensureDirectDriveImgUrl(item.logoBase64);
            cardsHtml += `
            <a href="${item.link}" target="_blank" class="hub-project-card" title="Mở Drive: ${item.projectName}">
                <img src="${logoSrc}" class="hub-project-logo">
                <span class="hub-project-name">${item.projectName}</span>
            </a>`;
        });

        html += `
        <div class="hub-category-card is-collapsed">
            <div class="hub-category-header" onclick="toggleHubCard(this)">
                <h3 class="hub-category-title">${c.icon} ${c.title} <span style="font-size: 11px; background: #E2E8F0; padding: 2px 8px; border-radius: 20px; color: #475569;">${catItems.length}</span></h3>
                <span class="hub-chevron">▼</span>
            </div>
            <div class="hub-category-body">
                <div class="hub-project-grid">${cardsHtml}</div>
            </div>
        </div>`;
    });
    
    if(html === "") html = `<div style="text-align:center; padding: 20px; color: #94A3B8; font-style: italic;">Chưa có dữ liệu tư liệu nào trong hệ thống.</div>`;
    container.innerHTML = html;
    container.style.display = 'flex';
}

function submitHubItem() {
    let cat = document.getElementById('hubCatInput').value;
    let proj = document.getElementById('hubProjInput').value;
    let link = document.getElementById('hubLinkInput').value.trim();
    let logoUrlInput = document.getElementById('logoDriveLinkInput').value.trim();
    let btn = document.getElementById('btnSubmitHub');
    
    if(!proj || !link) return alert("Vui lòng chọn Dự án và nhập Link Drive!");
    
    // 🚀 SỬA TẠI ĐÂY: Chuyển đổi link thô thành link lh3 sếch nét TRƯỚC KHI bắn xuống lưu ở backend
    let finalLogoUrl = ensureDirectDriveImgUrl(logoUrlInput);
    
    btn.innerText = "⏳"; btn.disabled = true;
    let sessionUser = (typeof appUser !== 'undefined' && appUser) ? appUser : JSON.parse(localStorage.getItem('appUserSession'));
    let payload = { category: cat, projectName: proj, link: link, logoBase64: finalLogoUrl };
    
    google.script.run.withSuccessHandler(res => {
        btn.innerText = "+ THÊM"; btn.disabled = false;
        if(res.success) {
            document.getElementById('hubLinkInput').value = "";
            document.getElementById('logoDriveLinkInput').value = "";
            document.getElementById('hubLogoPreview').style.display = "none";
            fetchMediaHubData(); // Load lại danh sách tư liệu
        } else { alert("Lỗi: " + res.message); }
    }).addMediaHubItem(payload, sessionUser);
}
</script>
