<style>
    #globalChatModal {
        position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        background: rgba(0, 0, 0, 0.65) !important; display: none; justify-content: center; align-items: center;
        z-index: 100000 !important; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(4px);
    }
    #globalChatModal.show { opacity: 1; display: flex !important; }
    
    .gc-modal-content {
        background: #F9F9FB; width: 95%; max-width: 650px; height: 90vh; max-height: 850px; border-radius: 16px;
        display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #globalChatModal.show .gc-modal-content { transform: scale(1); }

    .gc-header { background: linear-gradient(135deg, #1A4B9F 0%, #4285F4 100%); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .gc-header h3 { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; color: #FFF; margin: 0; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .gc-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #F9F9FB; }
    
    .gc-toolbar { background: #FFF; padding: 10px 20px; border-top: 1px solid #E5E7EB; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
    .gc-select { padding: 6px 10px; border-radius: 8px; border: 1px solid #D1D5DB; font-family: 'Inter', sans-serif; font-size: 12px; outline: none; background: #F8FAFD; color: #1A56B5; font-weight: 700; max-width: 180px; }
    
    .gc-checkbox-label { font-size: 12px; font-weight: 800; color: #555; display: flex; align-items: center; gap: 6px; cursor: pointer; background: #F3F4F6; padding: 6px 12px; border-radius: 20px; transition: 0.2s; border: 1px solid transparent;}
    .gc-checkbox-label:hover { background: #E8F0FE; border: 1px solid #B3CFFD; color: #1A56B5; }
    
    /* 🚀 BỘ CSS CHO MULTI-SELECT DROPDOWN */
    .ms-container { position: relative; }
    .ms-button { padding: 6px 10px; border-radius: 8px; border: 1px solid #D1D5DB; font-family: 'Inter', sans-serif; font-size: 12px; background: #F8FAFD; color: #1A56B5; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-width: 150px; transition: 0.2s;}
    .ms-button:hover { border-color: #4285F4; }
    .ms-dropdown { position: absolute; bottom: calc(100% + 5px); left: 0; background: #FFF; border: 1px solid #E5E7EB; border-radius: 12px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15); width: 240px; max-height: 250px; overflow-y: auto; display: none; z-index: 1000; padding: 10px; flex-direction: column; gap: 8px; }
    .ms-dropdown.show { display: flex; }
    .ms-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #333; cursor: pointer; padding: 6px; border-radius: 6px; transition: 0.2s; }
    .ms-label:hover { background: #F3F4F6; }
    .ms-label input { width: 16px; height: 16px; accent-color: #1A56B5; cursor: pointer; }

    .gc-footer { padding: 10px 20px 16px 20px; background: #FFF; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    .gc-input { flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid #D1D5DB; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; resize: none; max-height: 100px; background: #F3F4F6; }
    
    .gc-btn-icon { width: 38px; height: 38px; border-radius: 50%; background: #F3F4F6; color: #555; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0; font-size: 16px;}
    .gc-btn-icon:hover { background: #E5E7EB; color: #1A56B5; }
    .gc-btn-send { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #4285F4 0%, #1A56B5 100%); color: white; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(66,133,244,0.3); flex-shrink: 0; transition: 0.2s; }
    
    /* 🚀 BỘ CSS CHO INFO CENTER CONFIG BOX */
    .ic-config-box { display: none; padding: 14px 20px; background: #FFFBEB; border-top: 1px dashed #F59E0B; border-bottom: 1px dashed #F59E0B; flex-direction: column; gap: 12px; flex-shrink: 0; }
    .ic-config-box.show { display: flex; }
    .ic-config-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .ic-input { flex: 1; min-width: 150px; padding: 8px 12px; border: 1px solid #FCD34D; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; background: #FFF; transition: 0.2s; }
    .ic-input:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
    .ic-select { padding: 8px 12px; border: 1px solid #FCD34D; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; background: #FFF; font-weight: 600; cursor: pointer; }
    .ic-page-cb { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; cursor: pointer; background: #FFF; padding: 6px 12px; border-radius: 20px; border: 1px solid #FCD34D; color: #B45309; transition: 0.2s; }
    .ic-page-cb:hover { background: #FEF3C7; }
    .ic-page-cb input { accent-color: #D97706; cursor: pointer; width: 14px; height: 14px; }
</style>

<div id="globalChatModal" onclick="closeGlobalChatModal()">
    <div class="gc-modal-content" onclick="event.stopPropagation()">
        
        <div class="gc-header">
            <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
                <span style="font-size:20px; flex-shrink:0;">🔔</span>
                <h3 id="gcModalTitle">CỔNG THÔNG TIN TEAM</h3>
            </div>
            <button onclick="closeGlobalChatModal()" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; color:#FFF; font-size:16px; flex-shrink:0;">✕</button>
        </div>
        
        <div id="globalChatBoxContent" class="gc-body"></div>
        
        <div class="gc-toolbar">
            <label class="gc-checkbox-label" title="Ẩn danh với đồng nghiệp">
                <input type="checkbox" id="gcIsAnon"> 🕵️ Giấu mặt
            </label>
            
            <label class="gc-checkbox-label" id="lblInfoCenterToggle" style="display:none; background:#FEF3C7; color:#D97706; border-color:#FCD34D;" title="Chuyển sang chế độ phát Thông báo Hệ thống">
                <input type="checkbox" id="gcIsInfoCenter" onchange="toggleInfoCenterMode()"> 📢 Tạo Thông Báo
            </label>
            
            <div class="ms-container" id="gcReceiverContainer">
                <div class="ms-button" onclick="document.getElementById('gcReceiverDropdown').classList.toggle('show')">
                    <span id="msBtnText">Gửi: TẤT CẢ</span> <span style="font-size:10px; margin-left:8px;">▼</span>
                </div>
                <div class="ms-dropdown" id="gcReceiverDropdown">
                    <label class="ms-label" style="font-weight: 800; color: #1A56B5;"><input type="checkbox" id="recvAll" value="TẤT CẢ" checked onchange="toggleRecvAll(this)"> ✅ TẤT CẢ</label>
                    <hr style="margin:4px 0; border:0; border-top:1px dashed #E5E7EB;">
                    <div id="recvUserList" style="display:flex; flex-direction:column; gap:4px;"></div>
                </div>
            </div>

            <select id="gcType" class="gc-select"><option value="Chat Team">Loại: Chat Team</option></select>
        </div>
        
        <div class="ic-config-box" id="icConfigBox">
            <div class="ic-config-row">
                <input type="text" id="icTitle" class="ic-input" placeholder="Tiêu đề thông báo (VD: Nghỉ lễ 30/4)...">
                <select id="icSeverity" class="ic-select" style="color: #D97706;">
                    <option value="INFO" style="color: #059669;">🔵 Bình thường</option>
                    <option value="WARNING" selected style="color: #D97706;">🟠 Cảnh báo</option>
                    <option value="CRITICAL" style="color: #DC2626;">🔴 Khẩn cấp</option>
                </select>
            </div>
            <div class="ic-config-row">
                <div style="font-size: 12px; font-weight: 700; color: #B45309; white-space: nowrap;">Nơi hiển thị:</div>
                <label class="ic-page-cb"><input type="checkbox" value="Home" class="ic-page-val" checked> Home</label>
                <label class="ic-page-cb"><input type="checkbox" value="Task_list" class="ic-page-val" checked> Bảng Task</label>
                <label class="ic-page-cb"><input type="checkbox" value="Dashboard" class="ic-page-val" checked> Thống kê</label>
            </div>
            <div class="ic-config-row">
                <div style="font-size: 12px; font-weight: 700; color: #B45309; white-space: nowrap;">Hiệu lực từ:</div>
                <input type="date" id="icStartDate" class="ic-input" style="max-width: 140px; cursor: text;">
                <div style="font-size: 12px; font-weight: 700; color: #B45309; white-space: nowrap;">Đến hết:</div>
                <input type="date" id="icEndDate" class="ic-input" style="max-width: 140px; cursor: text;">
            </div>
        </div>

        <div class="gc-footer">
            <button class="gc-btn-icon" title="Đính kèm Ảnh" onclick="alert('Đang phát triển Upload!')">🖼️</button>
            <button class="gc-btn-icon" title="Đính kèm File" onclick="alert('Đang phát triển Upload!')">📎</button>
            <textarea id="globalChatInputArea" class="gc-input" rows="1" placeholder="Nhập nội dung (Shift+Enter xuống dòng)..." onkeydown="handleGlobalChatInput(event)"></textarea>
            <button onclick="submitGlobalChatMessage()" id="btnSendGlobalChat" class="gc-btn-send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        
    </div>
</div>

<script>
    var globalChatSyncTimer = null;
    var lastChatDataLength = 0;

    // 🚀 HÀM BẬT TẮT CHẾ ĐỘ INFO CENTER (ĐÃ BỌC THÉP CHỐNG LỖI DOM)
    function toggleInfoCenterMode() {
        let icToggle = document.getElementById('gcIsInfoCenter');
        let configBox = document.getElementById('icConfigBox');
        let inputArea = document.getElementById('globalChatInputArea');
        let typeSelect = document.getElementById('gcType');
        
        // Trạm gác: Nếu HTML chưa kịp tải thì dừng lại, không báo lỗi đỏ
        if (!icToggle || !configBox || !inputArea || !typeSelect) return;

        if (icToggle.checked) {
            configBox.classList.add('show');
            inputArea.placeholder = "Nhập nội dung chi tiết của Thông báo (Shift+Enter để xuống dòng)...";
            inputArea.style.border = "2px solid #F59E0B";
            inputArea.style.background = "#FFFBEB";
            typeSelect.style.display = 'none'; // Ẩn phân loại vì đây là thông báo hệ thống
        } else {
            configBox.classList.remove('show');
            inputArea.placeholder = "Nhập thông báo/Trao đổi (Shift+Enter để xuống dòng)...";
            inputArea.style.border = "1px solid #D1D5DB";
            inputArea.style.background = "#F3F4F6";
            typeSelect.style.display = 'block';
        }
    }

    // 🚀 LƯỚI BẮT BUG 1: Kiểm soát Click ra ngoài Dropdown để tự đóng
    document.addEventListener('click', function(e) {
        let dropdown = document.getElementById('gcReceiverDropdown');
        let container = document.getElementById('gcReceiverContainer');
        if (dropdown && dropdown.classList.contains('show') && !container.contains(e.target)) {
            dropdown.classList.remove('show');
        }
    });

    // 🚀 HÀM ĐIỀU KHIỂN TICK "TẤT CẢ"
    function toggleRecvAll(el) {
        let checkboxes = document.querySelectorAll('.recv-user-cb');
        checkboxes.forEach(cb => cb.checked = el.checked);
        updateMsBtnText();
    }

    // 🚀 HÀM ĐIỀU KHIỂN ĐỔI CHỮ HIỂN THỊ NÚT
    function updateMsBtnText() {
        let allCb = document.getElementById('recvAll');
        let checkboxes = Array.from(document.querySelectorAll('.recv-user-cb'));
        let checked = checkboxes.filter(cb => cb.checked);
        
        let text = "";
        if (allCb.checked || checked.length === checkboxes.length) {
            allCb.checked = true;
            checkboxes.forEach(cb => cb.checked = true);
            text = "Gửi: TẤT CẢ";
        } else if (checked.length === 0) {
            text = "Chọn người nhận...";
        } else {
            text = "Gửi: " + checked.length + " người";
        }
        document.getElementById('msBtnText').innerText = text;
    }

    // 🚀 BỘ ĐẾM KIỂM SOÁT LUỒNG TẢI DỮ LIỆU KÉP
    var isGcChatLoaded = false;
    var isGcDropdownLoaded = false;

    // Kích hoạt mở khóa giao diện khi cả 2 luồng đã tải xong
    function checkGcReady() {
        if (isGcChatLoaded && isGcDropdownLoaded) {
            document.querySelector('.gc-toolbar').style.display = 'flex';
            document.querySelector('.gc-footer').style.display = 'flex';
        }
    }

    // Hủy tick "TẤT CẢ" nếu có 1 ô bên dưới bị bỏ tick
    function checkIndividual(el) {
        let allCb = document.getElementById('recvAll');
        if (!el.checked) allCb.checked = false;
        updateMsBtnText();
    }

    function openGlobalChatModal() {
        const modal = document.getElementById('globalChatModal');
        if(!modal) return;
        
        // 🚀 TẮT HIỆU ỨNG RUNG TRÊN GIAO DIỆN CHUÔNG
        document.querySelectorAll('.has-unread').forEach(el => el.classList.remove('has-unread'));
        
        // 🚀 OPTISYNC V5: GHI NHẬN ĐÃ ĐỌC CHUÔNG (THEO LƯỚI CHẶN THỜI GIAN)
        if (typeof AppStore !== 'undefined') {
            let chatData = AppStore.getState().globalChat || [];
            let currentUserName = (typeof appUser !== 'undefined' && appUser) ? appUser.name : "";
            let latestUrgentAlert = null;
            let latestInfoAlert = null;
            let now = Date.now();

            // Quét tìm y hệt lõi Radar
            for (let i = chatData.length - 1; i >= 0; i--) {
                if (chatData[i].type === "INFO_CENTER") {
                    try {
                        let info = typeof chatData[i].text === "string" ? JSON.parse(chatData[i].text) : chatData[i].text;
                        let isStarted = !info.startDate || now >= info.startDate;
                        let isNotExpired = !info.endDate || now <= info.endDate;

                        if (isStarted && isNotExpired) {
                            let alertObj = { id: chatData[i].id, readByArr: chatData[i].readBy || [] };
                            if (info.severity === "WARNING" || info.severity === "CRITICAL") {
                                latestUrgentAlert = alertObj;
                                break; // 🚀 Chạm Trùm Cuối -> Chặn không quét tiếp
                            } else if (info.severity === "INFO" && !latestInfoAlert) {
                                latestInfoAlert = alertObj;
                            }
                        }
                    } catch(e) {}
                }
            }

            let alertsToProcess = [latestUrgentAlert, latestInfoAlert].filter(Boolean);
            let hasNewAlertsToSync = false;

            // Xử lý gửi báo cáo cho cả 2 lá bài đang cầm trên tay
            alertsToProcess.forEach(alert => {
                let readMark = currentUserName + "_Bell";
                let lockKey = "LOCK_" + alert.id + "_Bell";

                if (!alert.readByArr.includes(readMark) && !window[lockKey]) {
                    window[lockKey] = true;
                    console.log(`🔔 Đã ghi nhận xem Chuông. Mã: ${alert.id}`);
                    
                    AppStore.dispatchAction({
                        actionId: "READ_ALERT_" + alert.id + "_Bell_" + Date.now(),
                        actionType: "MARK_ALERT_READ",
                        alertId: alert.id,
                        userName: readMark
                    });
                    hasNewAlertsToSync = true;
                }
            });

            if (hasNewAlertsToSync) AppStore.flushQueue(); // 🚚 ÉP XE TẢI CHẠY LẬP TỨC
        }

        var sessionUser = (typeof appUser !== 'undefined' && appUser) ? appUser : JSON.parse(localStorage.getItem('appUserSession'));
        if (!sessionUser || sessionUser.role === 'Khách lạ') {
            alert("Vui lòng đăng nhập để truy cập Cổng thông tin Team!");
            return;
        }

        // Tạm ẩn Toolbar/Footer
        document.querySelector('.gc-toolbar').style.display = 'none';
        document.querySelector('.gc-footer').style.display = 'none';
        
        isGcChatLoaded = false;
        lastChatDataLength = -1; 

        const typeSelect = document.getElementById('gcType');
        const recvContainer = document.getElementById('gcReceiverContainer');
        const inputArea = document.getElementById('globalChatInputArea');
        const titleArea = document.getElementById('gcModalTitle');
        
        let icToggle = document.getElementById('gcIsInfoCenter');
        let lblInfoCenter = document.getElementById('lblInfoCenterToggle');
        if (icToggle) {
            icToggle.checked = false;
            toggleInfoCenterMode(); 
        }

        if (sessionUser.role === 'Admin' || sessionUser.role === 'Quản lý') {
            typeSelect.style.display = 'block';
            recvContainer.style.display = 'inline-block';
            if (lblInfoCenter) lblInfoCenter.style.display = 'flex'; 
            
            inputArea.placeholder = "Nhập thông báo/Trao đổi (Shift+Enter để xuống dòng)...";
            titleArea.innerText = "CỔNG THÔNG TIN TEAM";
            isGcDropdownLoaded = false;
            
            google.script.run
                .withSuccessHandler(function(data) {
                    if (data) {
                        let userHTML = "";
                        if (data.assignees) {
                            data.assignees.forEach(u => {
                                userHTML += `<label class="ms-label"><input type="checkbox" class="recv-user-cb" value="${u}" checked onchange="checkIndividual(this)"> ${u}</label>`;
                            });
                        }
                        document.getElementById('recvUserList').innerHTML = userHTML;

                        let typeOpts = `<option value="Chat Team">Phân loại: Chat Team</option>`;
                        if (data.infoTypes && data.infoTypes.length > 0) {
                            data.infoTypes.forEach(t => typeOpts += `<option value="${t}">Phân loại: ${t}</option>`);
                        }
                        document.getElementById('gcType').innerHTML = typeOpts;
                    }
                    isGcDropdownLoaded = true;
                    checkGcReady(); 
                })
                .withFailureHandler(function(err) {
                    console.error("🚨 Lỗi lấy Dropdown: ", err);
                    isGcDropdownLoaded = true; 
                    checkGcReady();
                })
                .getDropdownData();
                
        } else {
            typeSelect.style.display = 'none'; 
            recvContainer.style.display = 'none';
            if (lblInfoCenter) lblInfoCenter.style.display = 'none'; 
            inputArea.placeholder = "Gửi Góp ý / Báo cáo cho Admin...";
            titleArea.innerText = "TRUNG TÂM GÓP Ý & HỖ TRỢ";
            isGcDropdownLoaded = true; 
        }

        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
        
        document.getElementById('globalChatBoxContent').innerHTML = `
            <div style="text-align: center; padding: 60px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
                <div style="width: 42px; height: 42px; border: 4px solid rgba(66,133,244,0.1); border-top: 4px solid #4285F4; border-radius: 50%; display: inline-block; animation: spin-around 0.9s linear infinite;"></div>
                <div style="margin-top: 14px; color: #666; font-weight: 600; font-size: 14px;">Vui lòng đợi giây lát...</div>
            </div>`;
            
        fetchChatData(sessionUser);

        if(globalChatSyncTimer) clearInterval(globalChatSyncTimer);
        globalChatSyncTimer = setInterval(() => { fetchChatData(sessionUser); }, 5000);
    }

    function closeGlobalChatModal() {
        const modal = document.getElementById('globalChatModal');
        if(modal) { modal.classList.remove('show'); setTimeout(() => modal.style.display = 'none', 300); }
        if(globalChatSyncTimer) clearInterval(globalChatSyncTimer);
    }

    function handleGlobalChatInput(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitGlobalChatMessage(); }
        e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight < 100 ? e.target.scrollHeight : 100) + 'px';
    }

    // 🚀 LẤY DỮ LIỆU ĐỊNH KỲ
    function fetchChatData(user) {
        google.script.run.withSuccessHandler(res => { 
            // Đánh dấu luồng Tin nhắn đã tải xong
            if (!isGcChatLoaded) {
                isGcChatLoaded = true;
                checkGcReady(); // Gọi kiểm tra mở khóa
            }

            if (res.length !== lastChatDataLength) {
                renderGlobalChatHistory(res); 
                lastChatDataLength = res.length;
            }
        }).getGlobalChatMessages(user);
    }

    function renderGlobalChatHistory(messages) {
        const chatBox = document.getElementById('globalChatBoxContent');
        if (!chatBox) return;

        let validMessages = (messages || []).filter(m => m.text && m.text.toString().trim() !== "");
        if (validMessages.length === 0) {
            chatBox.innerHTML = `<div style="text-align: center; color: #999; margin-top: 40px; font-size: 13px; font-style: italic;">Không gian im ắng quá. Hãy gửi tin nhắn đầu tiên!</div>`;
            return;
        }
        
        let html = "";
        validMessages.forEach(msg => {
            let ui;
            let displaySenderName = msg.sender;
            
            if (msg.isAnon) {
                ui = { avtHtml: `<div style="width:32px; height:32px; border-radius:50%; background:#000; color:#FFF; display:flex; justify-content:center; align-items:center; font-weight:900; font-size:16px; border:2px solid rgba(0,0,0,0.1);">G</div>`, color: "#000000", glow: "transparent", textColor: "#FFF" };
                displaySenderName = "Kẻ giấu mặt"; 
            } else {
                ui = typeof buildUniversalAvatar === 'function' ? buildUniversalAvatar(displaySenderName, 32) : { avtHtml: "👤", color: "#4285F4", glow: "transparent", textColor: "#FFF" };
            }
            
            let receiverBadge = (msg.receiver !== "TẤT CẢ" && msg.receiver !== "Tất cả" && msg.receiver !== "") ? `<span style="background:#FEF7E0; color:#E37400; padding:2px 6px; border-radius:4px; font-size:10px; margin-right:4px;">Gửi: ${msg.receiver}</span>` : "";
            let typeBadge = (msg.type !== "Chat Team" && msg.type !== "INFO_CENTER") ? `<span style="background:#FCE8E6; color:#D93025; padding:2px 6px; border-radius:4px; font-size:10px; margin-right:4px;">${msg.type}</span>` : "";
            let timeHtml = msg.time ? `<div style="text-align: center; margin: 12px 0 4px 0;"><span style="background: rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.05); color: #777; border-radius: 12px; padding: 3px 12px; font-size: 10px; font-weight: 700;">🕒 ${msg.time}</span></div>` : "";
            
            let textContent = msg.text;

            // 🚀 BỘ DỊCH INFO CENTER: Biến JSON thành Khối Giao Diện Premium
            if (msg.type === "INFO_CENTER") {
                try {
                    let infoObj = typeof msg.text === "string" ? JSON.parse(msg.text) : msg.text;
                    let severityColor = infoObj.severity === "CRITICAL" ? "#DC2626" : (infoObj.severity === "WARNING" ? "#D97706" : "#059669");
                    let severityBg = infoObj.severity === "CRITICAL" ? "#FEF2F2" : (infoObj.severity === "WARNING" ? "#FFFBEB" : "#ECFDF5");
                    let severityBorder = infoObj.severity === "CRITICAL" ? "#FCA5A5" : (infoObj.severity === "WARNING" ? "#FCD34D" : "#6EE7B7");
                    let icon = infoObj.severity === "CRITICAL" ? "🚨" : (infoObj.severity === "WARNING" ? "⚠️" : "📢");
                    
                    textContent = `
                        <div style="background: ${severityBg}; border: 1px solid ${severityBorder}; border-radius: 12px; padding: 14px; margin-top: 6px; text-align: left; min-width: 250px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
                            <div style="font-weight: 900; color: ${severityColor}; font-size: 14.5px; margin-bottom: 8px; text-transform: uppercase; display: flex; align-items: center; gap: 6px;">${icon} THÔNG BÁO: ${infoObj.title}</div>
                            <div style="color: #111; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px;">${infoObj.message.replace(/\n/g, '<br>')}</div>
                            <div style="font-size: 11px; color: #666; font-style: italic; border-top: 1px dashed ${severityBorder}; padding-top: 8px;">
                                🎯 Nơi hiển thị: <span style="font-weight:700;">${infoObj.targetPages.join(', ')}</span><br>
                                ⏰ Hết hạn: <span style="font-weight:700;">${infoObj.endDate ? new Date(infoObj.endDate).toLocaleDateString('vi-VN') : 'Vô thời hạn'}</span>
                            </div>
                        </div>
                    `;
                    typeBadge = ""; 
                } catch(e) { textContent = `<div style="color:red; font-style:italic;">[Lỗi hiển thị dữ liệu JSON thông báo]</div>`; }
            } else {
                textContent = msg.text.replace(/\n/g, '<br>'); 
            }
            
            if (msg.isMe) {
                html += `
                    ${timeHtml}
                    <div style="display: flex; justify-content: flex-end; align-items: flex-end; gap: 8px; width: 100%;">
                        <div style="display: flex; flex-direction: column; align-items: flex-end; max-width: 80%;">
                            <span style="font-size: 11px; color: #999; margin-bottom: 4px; padding-right: 4px; font-weight:700;">Bạn ${msg.isAnon ? '<span style="color:#D93025; font-size:10px;">(Giấu mặt)</span>' : ''}</span>
                            <div style="background: linear-gradient(135deg, ${ui.color} 0%, ${ui.color}E6 100%); color: ${ui.textColor}; padding: 10px 14px; border-radius: 18px 18px 4px 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 4px 10px ${ui.glow}; word-break: break-word;">
                                ${typeBadge !== "" ? `<div style="margin-bottom:6px;">${typeBadge} ${receiverBadge}</div>` : ""}
                                ${textContent}
                            </div>
                        </div>
                        ${ui.avtHtml}
                    </div>
                `;
            } else {
                let nameColor = msg.isAnon ? "#111" : "#1A56B5";
                html += `
                    ${timeHtml}
                    <div style="display: flex; justify-content: flex-start; align-items: flex-end; gap: 8px; width: 100%;">
                        ${ui.avtHtml}
                        <div style="display: flex; flex-direction: column; align-items: flex-start; max-width: 80%;">
                            <span style="font-size: 11.5px; color: ${nameColor}; font-weight: 800; margin-bottom: 4px; padding-left: 4px;">${displaySenderName}</span>
                            <div style="background: #FFFFFF; color: #111; border: 1px solid #E5E7EB; padding: 10px 14px; border-radius: 18px 18px 18px 4px; font-size: 14px; line-height: 1.5; box-shadow: 0 4px 10px rgba(0,0,0,0.03); word-break: break-word;">
                                ${typeBadge !== "" ? `<div style="margin-bottom:6px;">${typeBadge} ${receiverBadge}</div>` : ""}
                                ${textContent}
                            </div>
                        </div>
                    </div>
                `;
            }
        });
        chatBox.innerHTML = html;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function submitGlobalChatMessage() {
        const input = document.getElementById('globalChatInputArea');
        let textContent = input.value.trim();
        if (textContent === "") return;
        
        let finalReceiver = "";
        let allCb = document.getElementById('recvAll');
        if (allCb && allCb.checked) {
            finalReceiver = "TẤT CẢ";
        } else {
            let checkedBoxes = Array.from(document.querySelectorAll('.recv-user-cb:checked')).map(cb => cb.value);
            if (checkedBoxes.length === 0) { alert("Vui lòng chọn ít nhất 1 người nhận!"); return; }
            finalReceiver = checkedBoxes.join(", ");
        }

        let isAnon = document.getElementById('gcIsAnon') ? document.getElementById('gcIsAnon').checked : false;
        let msgType = document.getElementById('gcType') ? document.getElementById('gcType').value : "Chat Team";
        let finalPayloadText = textContent;

        // 🚀 BỘ NÃO INFO CENTER: Kích hoạt đóng gói JSON nếu đang bật chế độ Tạo Thông Báo
        let isInfoCenter = document.getElementById('gcIsInfoCenter') && document.getElementById('gcIsInfoCenter').checked;
        if (isInfoCenter) {
            msgType = "INFO_CENTER"; // Cờ hiệu lệnh tuyệt đối để Backend và Receiver biết
            
            let title = document.getElementById('icTitle').value.trim();
            if (!title) { alert("Vui lòng nhập Tiêu đề thông báo!"); return; }
            
            let targetPages = Array.from(document.querySelectorAll('.ic-page-val:checked')).map(cb => cb.value);
            if (targetPages.length === 0) { alert("Vui lòng tick chọn ít nhất 1 trang hiển thị thông báo!"); return; }
            
            let severity = document.getElementById('icSeverity').value;
            let startDate = document.getElementById('icStartDate').value;
            let endDate = document.getElementById('icEndDate').value;
            
            // Nếu User có chọn Ngày, ta ép nó về mili-giây Timestamp để dễ so sánh Toán học
            let startMs = startDate ? new Date(startDate + "T00:00:00").getTime() : null;
            let endMs = endDate ? new Date(endDate + "T23:59:59").getTime() : null; // Đến 23:59:59 của ngày kết thúc
            
            if (startMs && endMs && startMs > endMs) { alert("Ngày kết thúc không được nhỏ hơn ngày bắt đầu!"); return; }

            // 🔥 Đóng gói toàn bộ cấu trúc thành 1 Object
            finalPayloadText = {
                title: title,
                message: textContent,
                targetPages: targetPages,
                severity: severity,
                startDate: startMs,
                endDate: endMs
            };
        }

        let payload = {
            text: finalPayloadText, 
            isAnon: isAnon,
            receiver: finalReceiver, 
            type: msgType
        };

        // 🚀 BƯỚC 1: ĐÓNG GÓI VÀ NÉM VÀO TRẠM CHỜ
        AppStore.dispatchAction({
            actionType: "SEND_CHAT",
            payload: payload
        });

        // 🚀 BƯỚC 2: TẠO TIN NHẮN ẢO LÊN MÀN HÌNH CHAT NGAY LẬP TỨC
        let now = new Date();
        let timeStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        let tempMsg = {
            sender: appUser.name, role: appUser.role, avatar: appUser.avatar || "",
            time: timeStr, 
            text: (typeof finalPayloadText === "object") ? JSON.stringify(finalPayloadText) : finalPayloadText, // 🚀 FIX: Ép kiểu để không vỡ JSON
            isAnon: isAnon,
            receiver: finalReceiver, 
            type: msgType,
            isMe: true,
            readBy: [appUser.name] // 🚀 Người gửi mặc nhiên đã đọc
        };

        // Bơm vào kho -> Bản đồ sẽ tự gọi renderGlobalChatHistory vẽ ra màn hình
        let currentChat = [...AppStore.getState().globalChat];
        currentChat.push(tempMsg);
        AppStore.setState({ globalChat: currentChat });

        // 🚀 BƯỚC 3: DỌN DẸP KHUNG NHẬP LIỆU
        input.value = "";
        input.style.height = 'auto'; 
    }
</script>
