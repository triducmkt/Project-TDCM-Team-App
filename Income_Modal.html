<script>
    var rawIncomeResponse = null;
    var currentIncomeTab = 0;

    // 🚀 ĐIỀU CHỈNH 2: BỘ SÀNG LỌC TỰ CHỮA LÀNH DỮ LIỆU LỊCH SỬ CŨ SANG MỚI REALTIME
    function normalizeAdminSalaryData(salariesObj) {
        if (!salariesObj) return {};
        let cleanObj = JSON.parse(JSON.stringify(salariesObj)); 
        
        Object.keys(cleanObj).forEach(user => {
            let years = cleanObj[user];
            if (!years || typeof years !== 'object') return;
            
            Object.keys(years).forEach(year => {
                let months = years[year];
                if (!months || typeof months !== 'object') return;
                
                Object.keys(months).forEach(month => {
                    let data = months[month];
                    if (!data || typeof data !== 'object') return;
                    
                    // Phát hiện nếu cấu trúc chứa l1/l2/b1/b2 cũ phẳng lặng
                    if (data.hasOwnProperty('l1') || data.hasOwnProperty('b1') || data.hasOwnProperty('l2') || data.hasOwnProperty('b2')) {
                        let oldL1 = data.l1 || 0; let oldB1 = data.b1 || 0;
                        let oldL2 = data.l2 || 0; let oldB2 = data.b2 || 0;
                        
                        // Tiến hành cấu trúc lại sang dạng mảng đa tầng dự án
                        months[month] = { "batch_1": [], "batch_2": [] };
                        
                        if (oldL1 > 0 || oldB1 > 0) {
                            months[month]["batch_1"].push({
                                id: "migrated_1_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
                                project: "Trí Đức Car Media", // Đưa về dự án mặc định hạch toán
                                salary: oldL1, bonus: oldB1
                            });
                        }
                        if (oldL2 > 0 || oldB2 > 0) {
                            months[month]["batch_2"].push({
                                id: "migrated_2_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
                                project: "Trí Đức Car Media", // Đưa về dự án mặc định hạch toán
                                salary: oldL2, bonus: oldB2
                            });
                        }
                    }
                });
            });
        });
        return cleanObj;
    }

    function formatMoneyInput(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if(val === '') { input.value = ''; return; }
        input.value = parseInt(val).toLocaleString('vi-VN');
    }

    function openIncomeModal() {
        const modal = document.getElementById('incomeModal');
        if(!modal) return;
        
        let bottomNav = document.querySelector('.mb-footer-nav');
        if(bottomNav) bottomNav.style.setProperty('display', 'none', 'important');
        
        var sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')) || { name: "Khách", role: "Khách" });
        document.getElementById('incomeTabUserName').innerText = sessionUser.name;
        
        let currentM = new Date().getMonth() + 1;
        document.getElementById('icFilterMonth').value = currentM.toString();
        
        modal.style.display = 'flex';
        window.APP_CURRENT_PAGE = "Income_modal";
        AppStore.notify(['globalChat']);
        setTimeout(() => { modal.style.opacity = '1'; modal.classList.add('show'); }, 10);
        
        document.getElementById('incomeModalLoader').style.display = 'block';
        document.getElementById('incomeModalView').style.display = 'none';

        google.script.run.withSuccessHandler(res => {
            // 🚀 Ép dỡ hàng qua trạm làm sạch cấu hình trước khi nạp vào RAM hệ thống
            if (res && res.adminSalaries) {
                res.adminSalaries = normalizeAdminSalaryData(res.adminSalaries);
            }
            rawIncomeResponse = res;
            
            document.getElementById('incomeModalLoader').style.display = 'none';
            document.getElementById('incomeModalView').style.display = 'block';
            if (sessionUser.role === 'Quản lý') {
                let userGroup = document.getElementById('icManagerUserFilterGroup');
                let userSelect = document.getElementById('icFilterManagerUser');
                if (userGroup && userSelect) {
                    userGroup.style.display = 'flex';
                    userSelect.innerHTML = '';
                    let uniqueUsers = Object.keys(res.avatars).sort();
                    uniqueUsers.forEach(u => {
                        let opt = document.createElement('option');
                        opt.value = u; opt.innerText = "Xem tài khoản: " + u;
                        if (u.toLowerCase() === sessionUser.name.toLowerCase()) opt.selected = true;
                        userSelect.appendChild(opt);
                    });
                }
            }
            renderPaymentInfoFields(sessionUser.name);
            switchIncomeTab(0);
        }).getFreelancerIncomeData(sessionUser);
    }

    function onManagerUserChange() {
        let targetUser = document.getElementById('icFilterManagerUser').value;
        renderPaymentInfoFields(targetUser);
        processAndRenderIncome();
    }

    function renderPaymentInfoFields(targetUser) {
        let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));
        let isMe = targetUser.toLowerCase() === sessionUser.name.toLowerCase();

        try {
            let pInfo = rawIncomeResponse.paymentInfos[targetUser];
            if (pInfo && pInfo.startsWith("{")) {
                let pObj = JSON.parse(pInfo);
                document.getElementById('ic_acc_name').value = pObj.name || "";
                document.getElementById('ic_acc_num').value = pObj.num || "";
                document.getElementById('ic_acc_bank').value = pObj.bank || "";
            } else {
                document.getElementById('ic_acc_name').value = "";
                document.getElementById('ic_acc_num').value = "";
                document.getElementById('ic_acc_bank').value = "";
            }
        } catch(err) { console.error(err); }

        document.getElementById('ic_acc_name').disabled = !isMe;
        document.getElementById('ic_acc_num').disabled = !isMe;
        document.getElementById('ic_acc_bank').disabled = !isMe;
    }

    function closeIncomeModal() {
        let modal = document.getElementById('incomeModal');
        if (modal) { modal.style.opacity = '0'; modal.classList.remove('show'); setTimeout(() => modal.style.display = 'none', 300); }
        window.APP_CURRENT_PAGE = 'Home';
        AppStore.notify(['globalChat']);
        let bottomNav = document.querySelector('.mb-footer-nav');
        if(bottomNav && typeof activePage !== 'undefined' && activePage !== 'Home') {
            bottomNav.style.setProperty('display', 'flex', 'important');
        }
    }

    function switchIncomeTab(tabIdx) {
        currentIncomeTab = tabIdx;
        let btns = document.querySelectorAll('.income-tab-btn');
        btns[0].classList.toggle('active', tabIdx === 0);
        btns[1].classList.toggle('active', tabIdx === 1);
        
        let paySec = document.getElementById('icPaymentInfoSection');
        if (paySec) paySec.style.display = (tabIdx === 1) ? 'block' : 'none';
        
        let mgrGroup = document.getElementById('icManagerUserFilterGroup');
        if (mgrGroup) {
            let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')) || {});
            if (sessionUser.role === 'Quản lý' && tabIdx === 1) {
                mgrGroup.style.display = 'flex';
            } else {
                mgrGroup.style.display = 'none';
            }
        }
        processAndRenderIncome();
    }

    function processAndRenderIncome() {
        if (!rawIncomeResponse) return;
        var sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')) || { name: "Khách", role: "Khách" });
        
        let fBatch = document.getElementById('icFilterBatch').value;
        let fMonth = document.getElementById('icFilterMonth').value;
        let fYear = document.getElementById('icFilterYear').value;

        let expandedTasks = [];
        rawIncomeResponse.tasks.forEach(t => {
            if (t.doinguoi && t.doinguoi.startsWith("{")) {
                try {
                    let dObj = JSON.parse(t.doinguoi);
                    if (dObj.oldAssignee && dObj.newAssignee) {
                        let newPrice = typeof dObj.newPrice === 'number' ? dObj.newPrice : t.price;
                        expandedTasks.push({ ...t, assignee: dObj.newAssignee, price: newPrice, isNewAssignee: true, oldAssignee: dObj.oldAssignee });
                        expandedTasks.push({ ...t, assignee: dObj.oldAssignee, price: newPrice, isOldAssignee: true, newAssignee: dObj.newAssignee });
                        return;
                    }
                } catch(e){}
            }
            expandedTasks.push(t);
        });

        let processedTasks = expandedTasks.map(t => {
            let b = 1, m = 1, y = 2026;
            if (t.ktt && t.ktt.match(/L(\d)\/T(\d+)/i)) {
                let match = t.ktt.match(/L(\d)\/T(\d+)/i);
                b = parseInt(match[1]); m = parseInt(match[2]);
                if (t.complete) { let pts = t.complete.split('/'); if (pts.length === 3) y = parseInt(pts[2]); }
            } else if (t.complete) {
                let pts = t.complete.split('/');
                if (pts.length === 3) { m = parseInt(pts[1]); y = parseInt(pts[2]); b = parseInt(pts[0]) <= 17 ? 1 : 2; }
            }
            return { ...t, calcBatch: b, calcMonth: m, calcYear: y };
        });

        let filteredTasks = processedTasks.filter(t => {
            if (fBatch !== "All" && t.calcBatch != fBatch) return false;
            if (fMonth !== "All" && t.calcMonth != fMonth) return false;
            if (fYear !== "All" && t.calcYear != fYear) return false;
            return true;
        });

        let userStats = {};
        processedTasks.forEach(t => {
            if (fMonth !== "All" && t.calcMonth != fMonth) return;
            if (fYear !== "All" && t.calcYear != fYear) return;
            
            let assigneesToCredit = [{ name: t.assignee, price: t.price }];
            if (t.doinguoi && t.doinguoi.startsWith("{")) {
                try {
                    let dObj = JSON.parse(t.doinguoi);
                    if (dObj.oldAssignee) assigneesToCredit.push({ name: dObj.oldAssignee, price: dObj.newPrice || t.price });
                } catch(e){}

                        </button>
                    </div>
                `;
            } else {
                html += `
                    <div style="margin-top: 20px; text-align: center; font-style: italic; color: #666; font-size: 13px; background: #F8FAFD; padding: 16px; border-radius: 12px; border: 1px dashed #B3CFFD;">
                        ⚠️ Vui lòng chọn lọc <strong>Đợt 1</strong> hoặc <strong>Đợt 2</strong> để xem các tùy chọn Xác nhận thanh toán và Xuất phiếu lương.

    function executeAddAdminSalaryRow(year, month, batch) {
        let sessionUser = (typeof appUser !== 'undefined' && appUser) ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));
        let targetUser = sessionUser.name; 
        if (sessionUser.role === 'Quản lý') {
            let mgrSelect = document.getElementById('icFilterManagerUser');
            if (mgrSelect) targetUser = mgrSelect.value;
        }

        let proj = document.getElementById('admNewProject').value;
        let sal = parseInt(document.getElementById('admNewSalary').value.replace(/[^0-9]/g, '')) || 0;
        let bns = parseInt(document.getElementById('admNewBonus').value.replace(/[^0-9]/g, '')) || 0;

        if(!proj) return alert("⚠️ Vui lòng chọn Tên dự án hạch toán!");
        if(!sal && !bns) return alert("⚠️ Vui lòng nhập số tiền Lương hoặc Bonus!");

        if (!rawIncomeResponse.adminSalaries) rawIncomeResponse.adminSalaries = {};
        if (!rawIncomeResponse.adminSalaries[targetUser]) rawIncomeResponse.adminSalaries[targetUser] = {};
        if (!rawIncomeResponse.adminSalaries[targetUser][year]) rawIncomeResponse.adminSalaries[targetUser][year] = {};
        if (!rawIncomeResponse.adminSalaries[targetUser][year][month]) rawIncomeResponse.adminSalaries[targetUser][year][month] = {};
        
        let batchKey = "batch_" + batch;
        if (!rawIncomeResponse.adminSalaries[targetUser][year][month][batchKey]) {
            rawIncomeResponse.adminSalaries[targetUser][year][month][batchKey] = [];
        }

        let newRow = { id: "temp_" + Date.now(), project: proj, salary: sal, bonus: bns };
        rawIncomeResponse.adminSalaries[targetUser][year][month][batchKey].push(newRow);

        window.recentEdits = window.recentEdits || {};
        window.recentEdits[targetUser + "_" + year + "_" + month + "_adminSal"] = { 
            time: Date.now(), 
            value: JSON.stringify(rawIncomeResponse.adminSalaries[targetUser][year][month]) 
        };

        AppStore.dispatchAction({
            actionType: "UPDATE_ADMIN_SALARY",
            payload: { userName: targetUser, year: year, month: month, batch: batch, project: proj, salary: sal, bonus: bns, salaryHistory: rawIncomeResponse.adminSalaries[targetUser] }
        });

        if (typeof window !== 'undefined' && window.DeliveryManager && typeof window.DeliveryManager.flushQueue === 'function') {
            window.DeliveryManager.flushQueue();
        }

        processAndRenderIncome(); 
    }

    function executeDeleteAdminSalaryRow(year, month, batch, itemId) {
        let sessionUser = (typeof appUser !== 'undefined' && appUser) ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));
        let targetUser = sessionUser.name; 
        if (sessionUser.role === 'Quản lý') {
            let mgrSelect = document.getElementById('icFilterManagerUser');
            if (mgrSelect) targetUser = mgrSelect.value;
        }

        if (!confirm(`Bạn có chắc chắn muốn xóa hạng mục lương Admin này không?`)) return;

        let batchKey = "batch_" + batch;
        if (rawIncomeResponse.adminSalaries && rawIncomeResponse.adminSalaries[targetUser] && rawIncomeResponse.adminSalaries[targetUser][year] && rawIncomeResponse.adminSalaries[targetUser][year][month]) {
            let arr = rawIncomeResponse.adminSalaries[targetUser][year][month][batchKey] || [];
            rawIncomeResponse.adminSalaries[targetUser][year][month][batchKey] = arr.filter(item => item.id !== itemId);
        }

        google.script.run.withSuccessHandler(() => {
            processAndRenderIncome();
        }).deleteAdminSalaryItem(targetUser, year, month, batch, itemId);

        processAndRenderIncome();
    }

    function autoSavePaymentInfo() {
        let name = document.getElementById('ic_acc_name').value.trim().toUpperCase();
        let num = document.getElementById('ic_acc_num').value.trim();
        let bank = document.getElementById('ic_acc_bank').value.trim().toUpperCase();
        
        document.getElementById('ic_acc_name').value = name;
        document.getElementById('ic_acc_bank').value = bank;

        let pStr = JSON.stringify({ name: name, num: num, bank: bank });
        let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));
        
        let statusEl = document.getElementById('icSaveStatus');
        if (statusEl) {
            statusEl.innerText = "⏳ Đang tự động lưu lên máy chủ...";
            statusEl.style.color = "#4285F4";
            statusEl.style.display = "block";
        }

        google.script.run.withSuccessHandler(res => {
            if (res.success && statusEl) {
                statusEl.innerText = "✓ Hệ thống đã tự động cập nhật số tài khoản!";
                statusEl.style.color = "#0D652D";
                setTimeout(() => { statusEl.style.display = "none"; }, 3000);
            }
        }).saveUserPaymentInfo(pStr, sessionUser);
    }

    function toggleConsentStyle(checkboxEl) {
        let textEl = document.getElementById('icConsentText');
        let wrapEl = document.getElementById('icConsentWrapper');
        let boxEl = document.getElementById('icConsentBox');   
        let tickEl = document.getElementById('icConsentTick'); 
        
        if (textEl && wrapEl && boxEl && tickEl) {
            if (checkboxEl.checked) {
                textEl.style.color = "#0D652D"; wrapEl.style.borderColor = "#0D652D"; wrapEl.style.background = "#E6F4EA";
                boxEl.style.borderColor = "#0D652D"; tickEl.style.opacity = "1"; tickEl.style.transform = "scale(1)";
            } else {
                textEl.style.color = "#333"; wrapEl.style.borderColor = "#B3CFFD"; wrapEl.style.background = "#E8F0FE";
                boxEl.style.borderColor = "#4285F4"; tickEl.style.opacity = "0"; tickEl.style.transform = "scale(0.5)";
            }
        }
        
        let fBatch = document.getElementById('icFilterBatch').value;
        let fMonth = document.getElementById('icFilterMonth').value;
        let fYear = document.getElementById('icFilterYear').value;
        let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));

        let targetUser = sessionUser.name;
        if (sessionUser.role === 'Quản lý') {
            let mgrSelect = document.getElementById('icFilterManagerUser');
            if (mgrSelect) targetUser = mgrSelect.value;
        }

        if (!rawIncomeResponse.consentData) rawIncomeResponse.consentData = {};
        if (!rawIncomeResponse.consentData[targetUser]) rawIncomeResponse.consentData[targetUser] = {};
        if (!rawIncomeResponse.consentData[targetUser][fYear]) rawIncomeResponse.consentData[targetUser][fYear] = {};
        if (!rawIncomeResponse.consentData[targetUser][fYear][fMonth]) rawIncomeResponse.consentData[targetUser][fYear][fMonth] = {};
        rawIncomeResponse.consentData[targetUser][fYear][fMonth][fBatch] = checkboxEl.checked;

        google.script.run.saveUserConsent(fYear, fMonth, fBatch, checkboxEl.checked, sessionUser);
        setTimeout(() => processAndRenderIncome(), 350);
    }

    function togglePaidStyle(checkboxEl) {
        let textEl = document.getElementById('icPaidText');
        let wrapEl = document.getElementById('icPaidWrapper');
        let boxEl = document.getElementById('icPaidBox');   
        let tickEl = document.getElementById('icPaidTick'); 
        let timeStampStr = "";
        
        if (textEl && wrapEl && boxEl && tickEl) {
            if (checkboxEl.checked) {
                let now = new Date();
                let timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                let dateStr = now.toLocaleDateString('vi-VN');
                timeStampStr = `${timeStr} - ${dateStr}`;
                
                textEl.innerText = `ĐÃ THANH TOÁN CHI LƯƠNG: ${timeStampStr}`;
                textEl.style.color = "#D93025"; wrapEl.style.borderColor = "#D93025"; wrapEl.style.background = "#FCE8E6";
                boxEl.style.borderColor = "#D93025"; tickEl.style.opacity = "1"; tickEl.style.transform = "scale(1)";
            } else {
                textEl.innerText = "CHƯA THANH TOÁN CHI LƯƠNG";
                textEl.style.color = "#5F6368"; wrapEl.style.borderColor = "#DADCE0"; wrapEl.style.background = "#F8F9FA";
                boxEl.style.borderColor = "#9AA0A6"; tickEl.style.opacity = "0"; tickEl.style.transform = "scale(0.5)";
            }
        }
        
        let fBatch = document.getElementById('icFilterBatch').value;
        let fMonth = document.getElementById('icFilterMonth').value;
        let fYear = document.getElementById('icFilterYear').value;
        let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')));

        let targetUser = sessionUser.name;
        if (sessionUser.role === 'Quản lý') {
            let mgrSelect = document.getElementById('icFilterManagerUser');
            if (mgrSelect) targetUser = mgrSelect.value;
        }

        if (!rawIncomeResponse.paidData) rawIncomeResponse.paidData = {};
        if (!rawIncomeResponse.paidData[targetUser]) rawIncomeResponse.paidData[targetUser] = {};
        if (!rawIncomeResponse.paidData[targetUser][fYear]) rawIncomeResponse.paidData[targetUser][fYear] = {};
        if (!rawIncomeResponse.paidData[targetUser][fYear][fMonth]) rawIncomeResponse.paidData[targetUser][fYear][fMonth] = {};
        
        let saveVal = checkboxEl.checked ? timeStampStr : false;
        rawIncomeResponse.paidData[targetUser][fYear][fMonth][fBatch] = saveVal;

        google.script.run.saveUserPaidStatus(fYear, fMonth, fBatch, saveVal, targetUser);

        if (checkboxEl.checked) {
            if (!rawIncomeResponse.consentData) rawIncomeResponse.consentData = {};
            if (!rawIncomeResponse.consentData[targetUser]) rawIncomeResponse.consentData[targetUser] = {};
            if (!rawIncomeResponse.consentData[targetUser][fYear]) rawIncomeResponse.consentData[targetUser][fYear] = {};
            if (!rawIncomeResponse.consentData[targetUser][fYear][fMonth]) rawIncomeResponse.consentData[targetUser][fYear][fMonth] = {};
            rawIncomeResponse.consentData[targetUser][fYear][fMonth][fBatch] = true;
            google.script.run.saveUserConsent(fYear, fMonth, fBatch, true, { name: targetUser, role: "Freelancer" });
        }
    
        setTimeout(() => processAndRenderIncome(), 350);
    }

    function toggleGlobalSection(targetId, headerEl) {
        let targetBody = document.getElementById(targetId);
        if (targetBody) {
            targetBody.classList.toggle('expanded');
            headerEl.classList.toggle('expanded');
        }
    }

    // 🚀 ĐIỀU CHỈNH 1: THIẾT KẾ PHIẾU LƯƠNG ADMIN TRONG BẢN IN PDF CAO CẤP CHUẨN ĐỒNG BỘ
    function exportSalaryToPDF() {
        let fBatch = document.getElementById('icFilterBatch').value;
        let fMonth = document.getElementById('icFilterMonth').value;
        let fYear = document.getElementById('icFilterYear').value;
        
        let txtB = fBatch === "All" ? "Tất cả các đợt" : ("Đợt " + fBatch);
        let txtM = fMonth === "All" ? "Tất cả các tháng" : ("Tháng " + fMonth);
        
        let sessionUser = (typeof appUser !== 'undefined') ? appUser : (JSON.parse(localStorage.getItem('appUserSession')) || {});
        let targetUser = sessionUser.name;
        if (sessionUser.role === 'Quản lý') {
            let mgrSelect = document.getElementById('icFilterManagerUser');
            if (mgrSelect) targetUser = mgrSelect.value;
        }

        let accName = document.getElementById('ic_acc_name').value || "Chưa cung cấp";
        let accNum = document.getElementById('ic_acc_num').value || "Chưa cung cấp";
        let accBank = document.getElementById('ic_acc_bank').value || "Chưa cung cấp";
        
        let taskTotalNum = parseInt(document.getElementById('adminBaseTotalHidden')?.value) || 0;
        let originalTable = document.querySelector('.ic-desktop-table table');
        let tableHtml = originalTable ? originalTable.outerHTML : "<p style='text-align:center;'>Không có dữ liệu task.</p>";

        let salaryHistoryObj = (rawIncomeResponse.adminSalaries && rawIncomeResponse.adminSalaries[targetUser]) ? rawIncomeResponse.adminSalaries[targetUser] : {};
        let monthData = (salaryHistoryObj[fYear] && salaryHistoryObj[fYear][fMonth]) ? salaryHistoryObj[fYear][fMonth] : {};
        let currentRows = [];
        
        if (fBatch === "1") currentRows = monthData.batch_1 || [];
        else if (fBatch === "2") currentRows = monthData.batch_2 || [];
        else {
            currentRows = [
                ...(monthData.batch_1 || []).map(r => ({...r, bText: "Đợt 1"})),
                ...(monthData.batch_2 || []).map(r => ({...r, bText: "Đợt 2"}))
            ];
        }

        let adminSalaryPart = currentRows.reduce((s, item) => s + (item.salary || 0) + (item.bonus || 0), 0);
        let finalAdminTotal = taskTotalNum + adminSalaryPart;

        let adminHtml = '';
        if (currentRows.length > 0) {
            let adminRowsHtml = '';
            currentRows.forEach(item => {
                adminRowsHtml += `
                    <tr>
                        <td style="padding: 12px 14px; text-align: left; font-weight: 700; color: #334155; border-bottom: 1px solid #E5E7EB;">${item.project} ${fBatch === 'All' ? `<span style="font-size:10px; background:#F3F4F6; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:normal; color:#666;">${item.bText}</span>` : ''}</td>

                <div style="margin-top: 25px; background: #FFFFFF; border: 1.5px solid #1A56B5; border-radius: 16px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 12px rgba(26,86,181,0.02);">
                    <div style="display:flex; align-items:center; gap:8px; margin: 0 0 16px 0; border-bottom: 2px solid #1A56B5; padding-bottom: 10px;">
                        <span style="font-size:16px;">👑</span>

                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; font-family:'Inter',sans-serif;">

                            <tr style="background: #F8FAFD;">
                                <th style="padding: 12px 14px; text-align: left; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #E5E7EB;">Dự án hạch toán</th>
                                <th style="padding: 12px 14px; text-align: right; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #E5E7EB; width:25%;">Lương cố định</th>
                                <th style="padding: 12px 14px; text-align: right; font-weight: 800; color: #475569; text-transform: uppercase; border-bottom: 2px solid #E5E7EB; width:25%;">Bonus</th>

                            </tr>
                        </tbody>
                    </table>
                </div>`;
        }

        let isConsented = document.getElementById('icConsentCheckbox') ? document.getElementById('icConsentCheckbox').checked : false;

        let printElement = document.createElement('div');

        printElement.style.padding = '40px 50px';
        printElement.style.background = '#FFF';
        
        printElement.innerHTML = `

                #printPdfWrapper * { font-family: 'Montserrat', 'Inter', sans-serif !important; }

                    <h2 style="margin: 0; color: #1A56B5; font-size: 22px; font-weight: 900;">TRÍ ĐỨC CAR MEDIA TEAM</h2>

            </div>
            <div style="background: #F8FAFD; border-left: 4px solid #1A56B5; padding: 16px 20px; margin-bottom: 25px;">

            </div>
        `;

        let fileName = `Phieu_luong_${targetUser.replace(/\s+/g, '_')}_Thang_${fMonth}_${fYear}.pdf`;
        let opt = { margin: 10, filename: fileName, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };

        if (navigator.share && window.innerWidth <= 768) {
            html2pdf().set(opt).from(printElement).outputPdf('blob').then(function(pdfBlob) {
                let file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                navigator.share({ files: [file], title: `Phiếu lương Trí Đức Media - ${targetUser}` }).catch(err => console.log('Hủy share:', err));

        } else {

        }
